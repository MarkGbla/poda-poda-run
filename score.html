<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your score · Poda-Poda Run</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #071c16; color: #fff; font-family: system-ui, sans-serif; }
    main { max-width: 1400px; margin: auto; padding: 32px; display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 32px; align-items: center; min-height: 100vh; }
    .flag { height: 6px; background: linear-gradient(to right, #1eb864 33.33%, white 33.33% 66.66%, #168bdd 66.66%); border-radius: 3px; }
    h1 { font-size: 36px; line-height: 1.1; margin-bottom: 16px; }
    p { color: #bed4ca; line-height: 1.6; }
    label { display: block; font-weight: 700; margin: 24px 0 8px; }
    input { width: 100%; border: 1px solid #638276; border-radius: 10px; padding: 14px; background: #122e24; color: white; font: inherit; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #62baff; outline-offset: 4px; }
    button, .play { display: block; width: 100%; padding: 15px; border-radius: 10px; border: 0; font: inherit; font-weight: 800; text-align: center; cursor: pointer; text-decoration: none; }
    button { margin-top: 24px; background: #2de27a; color: #062319; }
    button:disabled { opacity: .5; cursor: wait; }
    .play { margin-top: 12px; background: #194233; color: white; }
    #status { min-height: 48px; font-size: 14px; }
    canvas { display: block; width: 100%; height: auto; border-radius: 20px; box-shadow: 0 20px 70px #0008; }
    [hidden] { display: none !important; }
    .note { font-size: 13px; }
    @media (max-width: 760px) { main { padding: 20px; grid-template-columns: 1fr; gap: 20px; } h1 { font-size: 30px; } }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="title">
      <div class="flag" aria-hidden="true"></div>
      <h1 id="title">Your run.<br>Your score.</h1>
      <p>Your best saved run, ready to share with your crew.</p>
      <form id="editor">
        <label for="name">Player name</label>
        <input id="name" name="name" maxlength="24" placeholder="Salone driver" autocomplete="nickname" required>
        <p>Best score on this device</p>
        <strong id="score" style="font-size:36px" aria-live="polite">—</strong>
        <button id="share" type="submit" disabled>Share score</button>
      </form>
      <a class="play" href="/">Back to game</a>
      <p class="note">Game link: <a href="https://podapodarun.com/" style="color:#7bcaff;overflow-wrap:anywhere">https://podapodarun.com/</a></p>
      <p class="note">Your score is filled in automatically from your saved runs on this device.</p>
      <p id="status" role="status">Loading your score card…</p>
    </section>
    <canvas id="poster" width="1254" height="1254" role="img" aria-label="Your personalized Poda-Poda Run score card"></canvas>
  </main>
  <script type="module">
    import { createScorePoster } from '/src/ui/ScorePoster.js';
    const name = document.querySelector('#name');
    let savedRun = null;
    try {
      const rows = JSON.parse(localStorage.getItem('poda-scores-v2') || '[]');
      if (Array.isArray(rows)) savedRun = rows
        .filter(row => row && Number.isFinite(row.score) && row.score >= 0 && Number.isFinite(row.date))
        .sort((a, b) => b.score - a.score)[0] || null;
    } catch { /* No usable saved run on this device. */ }
    const score = savedRun?.score;
    document.querySelector('#score').textContent = savedRun ? score.toLocaleString('en-US') : '—';
    name.value = savedRun?.name || 'Guest Driver';
    const canvas = document.querySelector('#poster');
    const ctx = canvas.getContext('2d');
    const status = document.querySelector('#status');
    const share = document.querySelector('#share');
    const gameURL = 'https://podapodarun.com/';
    let posterBlob = null;
    let renderVersion = 0;
    async function copyFlyer(blob) {
      try {
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        status.textContent = 'Flyer copied. Paste it into WhatsApp and add the game link shown above.';
      } catch {
        status.textContent = 'This browser cannot share images. Open this page on a phone to share the flyer.';
      }
    }
    async function render() {
      const version = ++renderVersion;
      posterBlob = null; share.disabled = true;
      if (!savedRun) {
        canvas.hidden = true;
        document.querySelector('#editor').hidden = true;
        status.textContent = 'Finish a run to unlock your scorecard. Your score will appear here automatically.';
        return;
      }
      try {
        const blob = await createScorePoster({ name: name.value.trim() || 'Salone driver', score: score });
        const image = await createImageBitmap(blob);
        if (version !== renderVersion) { image.close(); return; }
        canvas.width = image.width; canvas.height = image.height;
        ctx.drawImage(image, 0, 0); image.close();
        canvas.setAttribute('aria-label', `${name.value.trim() || 'Salone driver'}: ${score.toLocaleString('en-US')} points in Poda-Poda Run.`);
        posterBlob = blob; share.disabled = false;
        status.textContent = 'Your preview updates as you type.';
      } catch {
        if (version === renderVersion) status.textContent = 'The artwork could not load. Edit your name or reload to try again.';
      }
    }
    document.querySelector('#editor').addEventListener('input', render);
    document.querySelector('#editor').addEventListener('submit', async event => {
      event.preventDefault();
      if (!name.value.trim()) { name.setCustomValidity('Enter your player name.'); name.reportValidity(); return; }
      if (!posterBlob) return;
      const file = new File([posterBlob], 'poda-poda-score.png', {type:'image/png'});
      const message = `${name.value.trim()} scored ${score.toLocaleString('en-US')} in Poda-Poda Run. Think you can beat me? Play: ${gameURL}`;
      if (navigator.canShare?.({files:[file]}) && navigator.share) {
        try {
          await navigator.share({files:[file], title:'Poda-Poda Run score', text:message});
          status.textContent = 'Score shared with your crew!';
        } catch (error) {
          if (error.name !== 'AbortError') await copyFlyer(posterBlob);
        }
      } else {
        await copyFlyer(posterBlob);
      }
    });
    name.addEventListener('input', () => name.setCustomValidity(''));
    render();
  </script>
</body>
</html>
